<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        
        <link rel="stylesheet" href="./icons/bootstrap-icons-1.13.1/bootstrap-icons.css">
        
        <link rel="stylesheet" href="../fonts.css">
        <link rel="stylesheet" href="./login-style.css">

        <title>PÁGINA LOGIN</title>
    </head>

    <body>
        <div class="main-content">
            <div id="left-area">
                <img src="../src/PMO-logo-degrade.png">
            </div>
        
            <div id="right-area">
                <div class="main-bubble">
                    <p id="login-text">Entrar</p>

                    <div id="user-input-area">
                        <p class="email text">E-mail</p>
                        <input class="email input" placeholder="Digite seu e-mail..."></input>
                    
                        <p class="password text">Senha</p>
                        <input class="password input" placeholder="Digite sua senha..."></input>
                    
                        <button class="forgot-password clickable">Esqueci a senha</button>
                    </div>
                    
                    <div id="register-area">
                        <p>Não é cadastrado?</p>
                        <button class="register-button clickable">Cadastre-se</button>
                    </div>

                    <button id="login-button">
                        <p>Entrar</p>
                        <i class="bi bi-box-arrow-in-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </body>
</html>
